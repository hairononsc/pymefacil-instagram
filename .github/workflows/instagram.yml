name: Publicar en Instagram

on:
  schedule:
    - cron: "7 * * * *"      # cada hora, al minuto 7; publica solo lo que ya toca según calendar.json
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write             # para guardar state.json (qué ya se publicó)

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publicar lo que toque
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
        run: python3 publisher/publish.py
      - name: Guardar el estado
        if: always()
        run: |
          git config user.name "pymefacil-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: estado de publicaciones de Instagram"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
